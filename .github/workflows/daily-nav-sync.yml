name: 中行净值增量

# 每天抓 **3 次**中国银行「当日代销理财产品净值」静态页，
# **只把新增的 (来源, 产品代码, 净值日期) 组合**存成 CSV 推回仓库。
#
# 文件名 = **数据日**（北京时间）：`data/YYYY-MM-DD.csv`
# 数据日 = **抓取日的前一天**（抓的是昨天披露出来的那一批）。
# 没有新增数据的那天**不产生文件**（仓库里不会出现只有表头的空 CSV）。
#
# ## 这是**唯一的抓取点**
#
# 抓取放在本仓库，理由有三个：
#
# 1. **要跑得久、要抓得多**。中行三个源合计 516 页，跨境单页 1.6~3 秒 ——
#    GitHub Actions 一次跑完没有子请求限制；放进有子请求上限的运行时里，
#    抓全站要 5 次调用。
# 2. **要留历史**。中行归档站每只产品只留最新一条，历史批次一旦被覆盖
#    就永久消失 —— 想攒净值序列**只能靠定期存快照**。这个历史属于「数据仓」，
#    不属于「应用仓」：往应用仓提交数据提交，会把代码变更历史搞脏。
# 3. **职责单一好排查**。抓取只在本仓库做 —— 两个地方都抓，
#    出问题时你分不清数据是哪条路来的。
#
# 使用方从本仓库读 CSV 导入。
#
# ## 为什么要自己攒
#
#   中行这个归档站**每只产品只保留最新的一条记录** ——
#   实测 196 页里 9,798 行、9,363 个产品代码，拥有 ≥2 个不同净值日期的产品 = **0 只**。
#   所以历史批次一旦被新披露覆盖就永久消失，想攒历史**只能定期存快照**。
#
# ## 为什么一天抓 3 次（而不是 1 次）
#
#   因为**中行是逐只产品、按各自节奏刷新的**，不是全站整批换血：
#   实测 122510D 的 11-23 那一档，是在「11-25 11:50 那轮抓完之后」才出现在页面上的。
#
#   每天只抓一次 = 每只产品每天**只有一次机会被看见**。
#   披露落在两次快照之间、又在下一次快照前被新一档覆盖 → 那档**永久消失**。
#   实测就丢过：122510D 的 2026-11-19（那天全库有 8,270 只产品披露了，
#   它也照常披露，但我们的快照没赶上）。
#
# ## 关键：中行**每天只把静态页重新生成一次**
#
#   实测（2026-11-26）：三个源的所有页 Last-Modified 完全相同 ——
#   srfd6 / srfd2 = 北京 11-25 12:30，srfd3 = 北京 11-25 13:00。
#   且 23 小时后 Last-Modified 没再变过 → **一天一轮**，整站同时换。
#   （srfd2 第 150 页以后还是 2026-09-20 的 —— 生成器只重写活跃的那几页。）
#
#   所以站点的「状态窗口」= **两次重新生成之间的 ~24 小时**。
#   我们的采样周期必须**短于 24 小时**，否则会整个窗口都没采到 ——
#   122510D 的 11-19 就是这么丢的：
#     11-23 09:14 那一轮在 11-23 12:30 重新生成**之前** → 看到旧的
#     11-24 13:04 那一轮在 11-24 12:30 重新生成**之后** → 看到新的
#     中间那个 24 小时的窗口（含 11-19 那档）**从没被采样过**。
#
#   每天 3 次 = 间隔 8 小时 < 24 小时 → **每个状态窗口至少被采到 2~3 次**，
#   怎么漂移都不会整个窗口落空。这是最省又够用的密度。
#
#   14:00（北京时间）这一轮特意卡在 12:30/13:00 的重新生成之后 ——
#   当天的新批次当天就能进库，不用等到第二天。
#
# ## 抓这么多会不会被屏蔽？不会（实测）
#
#   - 突发压测：并发 12、**212 req/s**、连续 400 页 → 零 429、零 403、零延迟惩罚
#     （响应头里也没有任何限流标记：没有 X-RateLimit / Retry-After / CDN 缓存头）
#   - 一天的量：3 轮 × 296 页 ≈ **888 页/天 ≈ 0.01 req/s**（平均）
#   - 脚本本身的保护：并发只有 4（同一主机开太多新连接容易触发限流）、
#     429 视为可重试（换候选 IP 再试）、每页 4 轮重试 + 退避、
#     60 天没变化的产品不抓不写。
#
# ## 丢档要看得见
#
#   每一轮都会往 `snapshots/YYYY-MM.jsonl` 追加一行「这一轮跑了什么」。
#   数据文件只记**新增**，所以「这一轮跑了但什么都没新增」在数据文件里是看不见的 ——
#   而判断某档净值是「产品没披露」还是「我们没拍到」，证据恰恰在这里。
#   `scripts/check-nav-gaps.mjs` 用这份清单把两者分开。
#
# ## 增量怎么判
#
#   仓库里已有的 `(source_dir, code, nav_date)` 组合不再重复记。
#   中途停跑几天 → 那几天的批次重新出现时会被自动补上（还没被覆盖的话）。
#
# ## 陈旧的产品不抓（一两个月没变化的）
#
#   净值日期早于「今天 − 60 天」的产品 = **一两个月没披露过**（中行只留最新一条，
#   日期不动就说明它没动）。这些产品只会在仓库里堆僵尸数据 —— 实测全站
#   9,798 行里有 1,713 行是这种。
#
#   日常跑：**分块翻页，某一块里最新的净值日期都早于截止日就早停**
#   （页序 = 披露批次，页码越小 = 披露日期越新，后面只会更老）。
#   实测三个源合计从 516 页降到 296 页（-43%）。
#
#   每周一次**全量扫描**兜底：万一页序有例外，早停可能漏掉个别产品，
#   全量扫描保证它们一周内被补上。落在**北京时间每周二**，
#   但一天有 3 轮 —— 所以**当天只全量一次**（靠快照清单里有没有当天的 full 记录判断）。

on:
  schedule:
    # UTC 22/6/14 = **北京时间 06:00 / 14:00 / 22:00**，每 8 小时一轮。
    #
    # 为什么是 3 个点：站点的状态窗口是两次重新生成之间的 ~24 小时，
    # 采样间隔必须短于它 —— 8 小时保证每个窗口至少采到 2~3 次（见上面）。
    # 14:00 这一轮卡在重新生成（12:30/13:00）之后，当天的新批次当天进库。
    #
    # 抓取口径仍然是 **数据日 = 抓取日 - 1**：
    # 中行按**估值日**披露、批次在第二天才刷新。
    # 同一天的几轮抓的是**同一个数据日**，写进**同一个文件**（脚本按去重键合并，不覆盖）。
    #
    # ⚠️ GitHub 的 schedule 会延迟（实测延迟 3.8~8 小时），
    # 所以「文件在哪天生成」和「数据属于哪天」必须分开记 —— 靠数据日，
    # 另外每行的 `snapshot_at` 记的是这一轮**实际开跑的时刻**。
    - cron: '0 22 * * *'
    - cron: '0 6 * * *'
    - cron: '0 14 * * *'
  # 手动补跑（workflow_dispatch 也能用来回补历史缺口）
  workflow_dispatch:
  # 推到 main 也跑一次 —— 改完脚本想立刻验证时很方便。
  #
  # 不会形成循环：workflow 自己推数据用的是 GITHUB_TOKEN，
  # 而 GitHub 明确「用 GITHUB_TOKEN 触发的事件不会产生新的 workflow run」
  # （workflow_dispatch / repository_dispatch 除外，本文件没有这两个）。
  push:
    branches:
      - main

permissions:
  contents: write

# 同一时间只跑一个 —— 上一次没跑完就排队，不打断。
# 打断会留下半截数据（写入是幂等的，但没必要）。
concurrency:
  group: boc-nav-daily
  cancel-in-progress: false

jobs:
  sync:
    name: 抓取中行净值增量并提交
    runs-on: ubuntu-latest
    # 跨境抓取，早停后实测 296 页；全量模式 516 页。
    # 跨境单页 1.6~3 秒，留足余量给跨境抖动和重试
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 传输层自测：把「302 重定向要跟随」「错误链要挖出真实原因」
      # 这类只在特定环境才复现的行为钉住。先跑它，抓之前就知道传输层没坏。
      - name: 传输层自测
        run: node scripts/fetch-boc-nav.mjs --selftest

      # 决定本轮是「日常早停」还是「每周全量」。
      #
      # 早停靠的是「页序 = 披露批次」这个性质（页码越小 = 披露日期越新）。
      # 万一哪天这个性质不成立了，早停就会漏掉个别产品 —— 所以**每周一次全量**兜底。
      #
      # ⚠️ 锚的是**北京时**的星期几：cron 的 `22/6/14 UTC` = 北京 06/14/22 点，
      # 所以「北京周二」那一组里**有一轮**会落在北京周二。
      # 这里判的是北京日期，所以全量落在北京周二 —— 别写成周一。
      #
      # ⚠️ 一天现在有 **3 轮**，全量**一天只跑一次**：
      # 全量一轮是 516 页，比早停多一倍多，四轮都跑没有意义。
      # 判断办法：看快照清单里**当天**有没有 mode=full 的记录 ——
      # 有了就说明今天已经全量过，这轮用早停。
      - name: 决定本轮模式
        id: mode
        run: |
          set -uo pipefail
          # +%u：1=周一 … 7=周日
          dow=$(TZ=Asia/Shanghai date +%u)
          today="$(TZ=Asia/Shanghai date +%F)"
          month="${today:0:7}"
          manifest="snapshots/${month}.jsonl"

          mode=fast
          if [ "$dow" = "2" ]; then
            if [ -f "$manifest" ] \
              && grep "\"snapshot_at\":\"${today}" "$manifest" | grep -q '"mode":"full"'; then
              echo "本轮：陈旧早停（今天已经全量过一次了）"
            else
              mode=full
              echo "本轮：全量扫描（每周一次的兜底）"
            fi
          else
            echo "本轮：陈旧早停（陈旧的产品不抓不写）"
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"

      # 脚本零第三方依赖（只用 Node 内建 http/https），不用 npm ci
      #
      # 整步重试 3 次：抓取是幂等的（写不写文件都算成功），
      # 而跨境链路本来就会间歇性抖动 —— 脚本内部已经有多候选 IP + 4 轮重试，
      # 这一层是给「整段都碰上坏节点」兜底。
      - name: 抓取并算增量
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -uo pipefail
          for i in 1 2 3; do
            echo "=== 抓取尝试 ${i}/3 ==="
            if [ "$MODE" = "full" ]; then
              # 全量：不过滤、不早停，什么都抓
              node scripts/fetch-boc-nav.mjs --full && { echo "抓取成功。"; exit 0; }
            else
              node scripts/fetch-boc-nav.mjs && { echo "抓取成功。"; exit 0; }
            fi
            echo "第 ${i} 次抓取失败，30 秒后重试…"
            sleep 30
          done
          echo "::error::连续 3 次抓取失败。"
          exit 1

      # 丢档体检：把「产品没披露」和「我们没拍到」分开。
      #
      # 不加 --strict —— 历史上已经丢了 2,600 多处（清单是新加的，
      # 分不出哪些是旧账），一失败就把整条流水线卡住没有意义。
      # 真正要看的是**清单生效之后**还在丢多少 → 摘要模式会单独报出来。
      - name: 净值丢档体检
        run: |
          node scripts/check-nav-gaps.mjs --summary

      - name: 提交数据日的数据
        env:
          # 用 GITHUB_TOKEN 推送的 commit **不会**再触发一轮 workflow，
          # 所以不会出现「提交 → 触发 → 提交」的循环。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # snapshots/ 也要提交 —— 那是「这一轮跑过」的证据，
          # 数据文件只记新增，光看数据是不知道某一轮跑没跑的。
          git add data/ snapshots/

          # 数据日 = 北京日历日 - 1。
          # ⚠️ 不能用 `date -d yesterday`：那减的是 24 小时，
          # 凌晨跑的时候减完还是同一个日期，日期没退过去。
          today="$(TZ=Asia/Shanghai date +%F)"
          data_date="$(date -u -d "${today} -1 day" +%F)"

          # 这一轮快照的时刻 —— 从快照清单里取（脚本刚写进去的，是权威值）。
          # 一天有 3 轮，同一个数据日会提交 3 次，靠这个区分。
          month="${today:0:7}"
          manifest="snapshots/${month}.jsonl"
          snapshot_at=""
          if [ -f "$manifest" ]; then
            snapshot_at="$(tail -n 1 "$manifest" | sed -n 's/.*"snapshot_at":"\([^"]*\)".*/\1/p')"
          fi

          if git diff --cached --quiet; then
            echo "这一轮没有任何变化（不应该发生 —— 快照清单每轮都会追加一行）。"
            exit 0
          fi

          git commit -m "data: ${data_date} 中行净值增量" -m "快照时刻：${snapshot_at}"

          # 认证走 `-c`：**不落盘**到 .git/config。
          # （checkout 用了 persist-credentials: false，所以这里要自己带上凭据）
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"

          for i in 1 2 3; do
            if git -c "http.https://github.com/.extraheader=${auth_header}" push origin HEAD:main; then
              echo "已推送。"
              exit 0
            fi
            echo "推送失败（第 ${i} 次），拉取后重试…"
            if ! git -c "http.https://github.com/.extraheader=${auth_header}" pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::拉取失败，放弃重试。"
              exit 1
            fi
            sleep $((i * 5))
          done
          echo "::error::推送失败，请手动检查。"
          exit 1
