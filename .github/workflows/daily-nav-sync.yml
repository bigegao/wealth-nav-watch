name: 中行净值每日增量

# 抓一次中国银行「当日代销理财产品净值」静态页，
# **只把新增的 (来源, 产品代码, 净值日期) 组合**存成 CSV 推回仓库。
#
# ⚠️ **定时触发已停**（2026-11-16）—— 改为**手动触发**。
#
# 停掉的理由：净值看板只认「最近披露」的那一批，历史批次每天都会被中行
# 的新披露覆盖 —— 每天自动抓一遍的边际收益很低，而跨境抓取一次要跑
# 300~500 页。要跑就手动触发（Actions → 中行净值每日增量 → Run workflow），
# 或本地 `node scripts/fetch-boc-nav.mjs`。
#
# 文件名 = **数据日**（北京时间）：`data/YYYY-MM-DD.csv`
# 数据日 = **抓取日的前一天**（凌晨 5 点抓的是昨天披露出来的那一批）。
# 没有新增数据的那天**不产生文件**（仓库里不会出现只有表头的空 CSV）。
#
# ## 这是**唯一的抓取点**
#
# 抓取放在本仓库、不放在 stock-tracer，理由有三个：
#
# 1. **要跑得久、要抓得多**。中行三个源合计 516 页，跨境单页 1.6~3 秒 ——
#    GitHub Actions 一次跑完没有子请求限制；Workers 免费版每次调用只有
#    50 次子请求，抓全站要 5 次调用。
# 2. **要留历史**。中行归档站每只产品只留最新一条，历史批次一旦被覆盖
#    就永久消失 —— 想攒净值序列**只能每批存一条**。这个历史属于「数据仓」，
#    不属于「应用仓」：每天往应用仓提交一次数据提交，会把代码变更历史搞脏。
# 3. **职责单一好排查**。stock-tracer 只做导入，不自己抓 ——
#    两个地方都抓，出问题时你分不清数据是哪条路来的。
#
# stock-tracer 那边对应的是「中行净值导入」那条流水线（手动拉本仓库的 CSV）。
#
# ## 为什么要自己攒
#
#   中行这个归档站**每只产品只保留最新的一条记录** ——
#   实测 196 页里 9,798 行、9,363 个产品代码，拥有 ≥2 个不同净值日期的产品 = **0 只**。
#   所以历史批次一旦被新披露覆盖就永久消失，想攒历史**只能每批存一条**。
#
# ## 增量怎么判
#
#   仓库里已有的 `(source_dir, code, nav_date)` 组合不再重复记。
#   中途停跑几天 → 那几天的批次重新出现时会被自动补上（还没被覆盖的话）。
#
# ## 陈旧的产品不抓（一两个月没变化的）
#
#   净值日期早于「今天 − 60 天」的产品 = **一两个月没披露过**（中行只留最新一条，
#   日期不动就说明它没动）。这些产品只会在仓库里堆僵尸数据 —— 实测全站
#   9,798 行里有 1,713 行是这种。
#
#   日常跑：**分块翻页，某一块里最新的净值日期都早于截止日就早停**
#   （页序 = 披露批次，页码越小 = 披露日期越新，后面只会更老）。
#   实测三个源合计从 516 页降到 296 页（-43%）。
#
#   **全量扫描**兜底：万一页序有例外，早停可能漏掉个别产品，
#   全量扫描保证它们被补上。手动触发时默认按**北京星期几**判断
#   （北京周二 → 全量，其余 → 早停），也可以在触发时显式选 `full`。

on:
  # ⚠️ **定时触发已停**（2026-11-16）—— `schedule` 段已移除。
  #
  # 停掉的理由：净值看板只认「最近披露」的那一批，历史批次每天都被中行
  # 的新披露覆盖 —— 每天自动抓一遍的边际收益很低，而跨境抓取一次要跑
  # 300~500 页。
  #
  # 要恢复定时，把下面这段取消注释即可（UTC 21:00 = 北京次日 05:00：
  # 中行按**估值日**披露、批次白天才刷新，凌晨抓到的必然是「昨天那一批」）：
  #
  #   schedule:
  #     # ⚠️ GitHub 的 schedule 会延迟（实测延迟过 7 小时），
  #     # 所以「文件在哪天生成」和「数据属于哪天」必须分开记 —— 靠数据日。
  #     - cron: '0 21 * * *'
  #
  # 保留 `workflow_dispatch`（手动）与 `push`（改完脚本立刻验证）。
  workflow_dispatch:
    inputs:
      mode:
        description: '抓取模式：auto=按北京星期几自动判断（周二全量，其余早停）；full=全量扫描；fast=陈旧早停'
        required: false
        default: 'auto'
        type: string
  # 推到 main 也跑一次 —— 改完脚本想立刻验证时很方便。
  #
  # 不会形成循环：workflow 自己推数据用的是 GITHUB_TOKEN，
  # 而 GitHub 明确「用 GITHUB_TOKEN 触发的事件不会产生新的 workflow run」
  # （workflow_dispatch / repository_dispatch 除外，本文件没有这两个）。
  push:
    branches:
      - main

permissions:
  contents: write

# 同一时间只跑一个 —— 上一次没跑完就排队，不打断。
# 打断会留下半截数据（写入是幂等的，但没必要）。
concurrency:
  group: boc-nav-daily
  cancel-in-progress: false

jobs:
  sync:
    name: 抓取中行净值增量并提交
    runs-on: ubuntu-latest
    # 跨境抓取，早停后实测 296 页；全量模式 516 页。
    # 跨境单页 1.6~3 秒，留足余量给跨境抖动和重试
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 传输层自测：把「302 重定向要跟随」「错误链要挖出真实原因」
      # 这类只在特定环境才复现的行为钉住。先跑它，抓之前就知道传输层没坏。
      - name: 传输层自测
        run: node scripts/fetch-boc-nav.mjs --selftest

      # 决定本轮是「早停」还是「全量」。
      #
      # 早停靠的是「页序 = 披露批次」这个性质（页码越小 = 披露日期越新）。
      # 万一哪天这个性质不成立了，早停就会漏掉个别产品 —— 所以有**全量**这一档兜底。
      #
      # 定时触发已停，现在是手动跑：默认按**北京时**的星期几判断
      # （北京周二 → 全量，其余 → 早停），也可以在触发时把 `mode` 显式选成 `full`。
      - name: 决定本轮模式
        id: mode
        env:
          REQUESTED: ${{ inputs.mode }}
        run: |
          # 触发时指定了 mode 就用它；没指定（或 auto）才按北京星期几判断。
          mode="${REQUESTED:-auto}"
          if [ -z "$mode" ] || [ "$mode" = "auto" ]; then
            # +%u：1=周一 … 7=周日
            dow=$(TZ=Asia/Shanghai date +%u)
            if [ "$dow" = "2" ]; then
              mode="full"
            else
              mode="fast"
            fi
          fi
          if [ "$mode" = "full" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "本轮：全量扫描（全站都翻）"
          else
            echo "mode=fast" >> "$GITHUB_OUTPUT"
            echo "本轮：陈旧早停（陈旧的产品不抓不写）"
          fi

      # 脚本零第三方依赖（只用 Node 内建 http/https），不用 npm ci
      #
      # 整步重试 3 次：抓取是幂等的（写不写文件都算成功），
      # 而跨境链路本来就会间歇性抖动 —— 脚本内部已经有多候选 IP + 4 轮重试，
      # 这一层是给「整段都碰上坏节点」兜底。
      - name: 抓取并算增量
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -uo pipefail
          for i in 1 2 3; do
            echo "=== 抓取尝试 ${i}/3 ==="
            if [ "$MODE" = "full" ]; then
              # 全量：不过滤、不早停，什么都抓
              node scripts/fetch-boc-nav.mjs --full && { echo "抓取成功。"; exit 0; }
            else
              node scripts/fetch-boc-nav.mjs && { echo "抓取成功。"; exit 0; }
            fi
            echo "第 ${i} 次抓取失败，30 秒后重试…"
            sleep 30
          done
          echo "::error::连续 3 次抓取失败。"
          exit 1

      - name: 提交数据日的数据
        env:
          # 用 GITHUB_TOKEN 推送的 commit **不会**再触发一轮 workflow，
          # 所以不会出现「提交 → 触发 → 提交」的循环。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/
          if git diff --cached --quiet; then
            echo "没有新增净值，仓库保持不变。"
            exit 0
          fi

          # 数据日 = 北京日历日 - 1。
          # ⚠️ 不能用 `date -d yesterday`：那减的是 24 小时，
          # 凌晨跑的时候减完还是同一个日期，日期没退过去。
          today="$(TZ=Asia/Shanghai date +%F)"
          data_date="$(date -u -d "${today} -1 day" +%F)"
          git commit -m "data: ${data_date} 中行净值增量"

          # 认证走 `-c`：**不落盘**到 .git/config。
          # （checkout 用了 persist-credentials: false，所以这里要自己带上凭据）
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"

          for i in 1 2 3; do
            if git -c "http.https://github.com/.extraheader=${auth_header}" push origin HEAD:main; then
              echo "已推送。"
              exit 0
            fi
            echo "推送失败（第 ${i} 次），拉取后重试…"
            if ! git -c "http.https://github.com/.extraheader=${auth_header}" pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::拉取失败，放弃重试。"
              exit 1
            fi
            sleep $((i * 5))
          done
          echo "::error::推送失败，请手动检查。"
          exit 1
