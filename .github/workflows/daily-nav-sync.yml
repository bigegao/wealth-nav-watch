name: 中行净值每日增量

# 每天抓一次中国银行「当日代销理财产品净值」静态页，
# **只把新增的 (来源, 产品代码, 净值日期) 组合**存成 CSV 推回仓库。
#
# 文件名 = **数据日**（北京时间）：`data/YYYY-MM-DD.csv`
# 数据日 = **抓取日的前一天**（凌晨 5 点抓的是昨天披露出来的那一批）。
# 没有新增数据的那天**不产生文件**（仓库里不会出现只有表头的空 CSV）。
#
# 为什么要自己攒：
#   中行这个归档站**每只产品只保留最新的一条记录** ——
#   实测 196 页里 9,798 行、9,363 个产品代码，拥有 ≥2 个不同净值日期的产品 = **0 只**。
#   所以历史批次一旦被新披露覆盖就永久消失，想攒历史**只能每天存一条**。
#
# 增量怎么判：
#   仓库里已有的 `(source_dir, code, nav_date)` 组合不再重复记。
#   中途停跑几天 → 那几天的批次重新出现时会被自动补上（还没被覆盖的话）。

on:
  schedule:
    # UTC 21:00 = **北京时间次日 05:00**。
    #
    # 为什么是凌晨 5 点：中行按**估值日**披露，批次在**白天**才刷新 ——
    # 实测 11-12 白天页面上的最新批次是 11-11，而 11-12 凌晨还是 11-10。
    # 所以凌晨抓到的必然是「昨天那一批」，文件名与 `data_date` 列统一用
    # **数据日 = 抓取日 - 1**，不再用「我什么时候跑的」。
    #
    # ⚠️ GitHub 的 schedule 会延迟（实测延迟过 7 小时），
    # 所以「文件在哪天生成」和「数据属于哪天」必须分开记 —— 靠数据日。
    - cron: '0 21 * * *'
  # 手动补跑（workflow_dispatch 也能用来回补历史缺口）
  workflow_dispatch:
  # 推到 main 也跑一次 —— 改完脚本想立刻验证时很方便。
  #
  # 不会形成循环：workflow 自己推数据用的是 GITHUB_TOKEN，
  # 而 GitHub 明确「用 GITHUB_TOKEN 触发的事件不会产生新的 workflow run」
  # （workflow_dispatch / repository_dispatch 除外，本文件没有这两个）。
  push:
    branches:
      - main

permissions:
  contents: write

# 同一时间只跑一个 —— 上一次没跑完就排队，不打断。
# 打断会留下半截数据（写入是幂等的，但没必要）。
concurrency:
  group: boc-nav-daily
  cancel-in-progress: false

jobs:
  sync:
    name: 抓取中行净值增量并提交
    runs-on: ubuntu-latest
    # 跨境抓 520 页，实测约 5 分钟；留足余量给跨境抖动和重试
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 传输层自测：把「302 重定向要跟随」「错误链要挖出真实原因」
      # 这类只在特定环境才复现的行为钉住。先跑它，抓之前就知道传输层没坏。
      - name: 传输层自测
        run: node scripts/fetch-boc-nav.mjs --selftest

      # 脚本零第三方依赖（只用 Node 内建 http/https），不用 npm ci
      #
      # 整步重试 3 次：抓取是幂等的（写不写文件都算成功），
      # 而跨境链路本来就会间歇性抖动 —— 脚本内部已经有多候选 IP + 4 轮重试，
      # 这一层是给「整段都碰上坏节点」兜底。
      - name: 抓取并算增量
        run: |
          set -uo pipefail
          for i in 1 2 3; do
            echo "=== 抓取尝试 ${i}/3 ==="
            if node scripts/fetch-boc-nav.mjs; then
              echo "抓取成功。"
              exit 0
            fi
            echo "第 ${i} 次抓取失败，30 秒后重试…"
            sleep 30
          done
          echo "::error::连续 3 次抓取失败。"
          exit 1

      - name: 提交数据日的数据
        env:
          # 用 GITHUB_TOKEN 推送的 commit **不会**再触发一轮 workflow，
          # 所以不会出现「提交 → 触发 → 提交」的循环。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/
          if git diff --cached --quiet; then
            echo "没有新增净值，仓库保持不变。"
            exit 0
          fi

          # 数据日 = 北京日历日 - 1。
          # ⚠️ 不能用 `date -d yesterday`：那减的是 24 小时，
          # 凌晨跑的时候减完还是同一个日期，日期没退过去。
          today="$(TZ=Asia/Shanghai date +%F)"
          data_date="$(date -u -d "${today} -1 day" +%F)"
          git commit -m "data: ${data_date} 中行净值增量"

          # 认证走 `-c`：**不落盘**到 .git/config。
          # （checkout 用了 persist-credentials: false，所以这里要自己带上凭据）
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"

          for i in 1 2 3; do
            if git -c "http.https://github.com/.extraheader=${auth_header}" push origin HEAD:main; then
              echo "已推送。"
              exit 0
            fi
            echo "推送失败（第 ${i} 次），拉取后重试…"
            if ! git -c "http.https://github.com/.extraheader=${auth_header}" pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::拉取失败，放弃重试。"
              exit 1
            fi
            sleep $((i * 5))
          done
          echo "::error::推送失败，请手动检查。"
          exit 1
